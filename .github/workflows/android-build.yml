name: Build Nattawut SmartGauge APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-build.yml'
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/smartgauge"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/smartgauge"

          PROJECT_DIR="$(find "$RUNNER_TEMP/smartgauge" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle not found in ZIP"
            exit 1
          fi

          rsync -a --exclude='.github' "$PROJECT_DIR/" ./

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nattawut-SmartGauge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
